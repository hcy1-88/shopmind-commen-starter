# Shopmind Common Starter 配置示例
# 请根据实际情况调整配置

spring:
  application:
    name: your-service-name  # 应用名称，用于日志文件命名
  data:
    redis:
          host: localhost
          port: 6379
          password: your-redis-password
          database: 0
  cloud:
    stream:
          rocketmq:
            binder:
              name-server: 127.0.0.1:9876

# Shopmind 认证配置
shopmind:
  auth:
    enabled: true  # 是否启用认证拦截器，默认 true
    jwt-secret: your-jwt-secret-key-here  # JWT 密钥（生产环境务必修改）
    log-enabled: true  # 是否打印认证日志，默认 true

    # 系统白名单（一般无需修改）
    # 业务接口默认公开，使用 @RequireAuth 注解标记需要认证的接口
    system-whitelist:
      - /error
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /favicon.ico

  # 日志配置
  log:
    path: ./logs  # 日志文件路径，默认 ./logs


# 如果启用了 Redis，需要配置 Redisson

# 如果启用了 Seata，需要配置 Seata
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-group
  service:
    vgroup-mapping:
      ${spring.application.name}-group: default
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP

# 如果启用了 RocketMQ，需要配置 RocketMQ
