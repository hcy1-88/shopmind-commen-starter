# Shopmind Common Starter 配置示例
# 请根据实际情况调整配置

spring:
  application:
    name: your-service-name  # 应用名称，用于日志文件命名

# Shopmind 认证配置
shopmind:
  auth:
    enabled: true  # 是否启用认证，默认 true
    jwt-secret: your-jwt-secret-key-here  # JWT 密钥（生产环境务必修改）
    log-enabled: true  # 是否打印认证日志，默认 true
    whitelist:  # 白名单路径（不需要登录的接口）
      - /error
      - /actuator/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /health
      - /info
      # 添加你自己的白名单路径
      - /api/auth/login
      - /api/auth/register
      - /api/public/**

  # 日志配置
  log:
    path: ./logs  # 日志文件路径，默认 ./logs

  # Redis 配置（可选，仅在需要时启用）
  redis:
    enabled: false  # 是否启用 Redis，默认 false

  # Seata 配置（可选，仅在需要时启用）
  seata:
    enabled: false  # 是否启用 Seata，默认 false

  # RocketMQ 配置（可选，仅在需要时启用）
  rocketmq:
    enabled: false  # 是否启用 RocketMQ，默认 false

# 如果启用了 Redis，需要配置 Redisson
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: your-redis-password
      database: 0

# 如果启用了 Seata，需要配置 Seata
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-group
  service:
    vgroup-mapping:
      ${spring.application.name}-group: default
  registry:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: ""
      group: SEATA_GROUP

# 如果启用了 RocketMQ，需要配置 RocketMQ
spring:
  cloud:
    stream:
      rocketmq:
        binder:
          name-server: 127.0.0.1:9876
